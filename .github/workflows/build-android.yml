name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate PNG icons from SVG
        run: |
          node -e "
          const sharp = require('sharp');
          const fs = require('fs');
          const svg = fs.readFileSync('web/icons/icon.svg');
          const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
          Promise.all(sizes.map(size =>
            sharp(svg).resize(size, size).png().toFile('web/icons/icon-' + size + '.png')
          )).then(() => console.log('Icons generated'));
          "

      - name: Sync Capacitor (copy web assets to Android)
        run: npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: happymoments-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      - name: Delete old release if exists
        run: gh release delete latest --yes 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old tag if exists
        run: git push origin :refs/tags/latest 2>/dev/null || true

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "HappyMoments - Download APK"
          body: |
            ## Install on Android
            1. Download **app-debug.apk** below
            2. Transfer to your phone (Viber, email, USB)
            3. Open the APK on your phone and install
            4. You may need to allow "Install from unknown sources"
          files: android/app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
