name: Build Android APK & AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate PNG icons from SVG
        run: |
          node -e "
          const sharp = require('sharp');
          const fs = require('fs');
          const svg = fs.readFileSync('web/icons/icon.svg');
          const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
          Promise.all(sizes.map(size =>
            sharp(svg).resize(size, size).png().toFile('web/icons/icon-' + size + '.png')
          )).then(() => console.log('Icons generated'));
          "

      - name: Build production assets
        run: node build.js

      - name: Sync Capacitor (copy dist/ to Android)
        run: npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build release AAB (for Play Store)
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: happymoments-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      - name: Upload release AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: happymoments-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90

      - name: Delete old release if exists
        run: gh release delete latest --yes 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old tag if exists
        run: git push origin :refs/tags/latest 2>/dev/null || true

      - name: Create GitHub Release with APK & AAB
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "HappyMoments v1.0 - Android Build"
          body: |
            ## Download Android App

            **For direct install (testing):**
            Download `app-debug.apk`, transfer to phone, install.

            **For Google Play (Internal Testing):**
            Download `app-release.aab`, upload to Play Console → Internal Testing track.
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
