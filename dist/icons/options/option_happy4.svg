<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- HAPPY 4: Clean modern — white background, colorful 3 character, very kawaii -->
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff8844"/>
      <stop offset="100%" style="stop-color:#ff5522"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="#ffffff"/>

  <!-- Subtle background pattern -->
  <circle cx="256" cy="256" r="220" fill="#fff5ee" opacity="0.5"/>

  <!-- BIG CHUNKY ORANGE "3" -->
  <text x="280" y="385" font-family="Arial Rounded MT Bold,Nunito,Arial,sans-serif" font-size="370" font-weight="900" fill="url(#bodyGrad)" text-anchor="middle">3</text>

  <!-- === HUGE KAWAII EYES in upper area === -->
  <!-- Left eye -->
  <circle cx="240" cy="170" r="30" fill="white" stroke="#333" stroke-width="2"/>
  <circle cx="246" cy="174" r="19" fill="#222"/>
  <circle cx="253" cy="162" r="9" fill="white"/>
  <circle cx="240" cy="180" r="5" fill="white" opacity="0.5"/>
  <!-- Right eye -->
  <circle cx="335" cy="165" r="28" fill="white" stroke="#333" stroke-width="2"/>
  <circle cx="340" cy="169" r="18" fill="#222"/>
  <circle cx="347" cy="157" r="8.5" fill="white"/>
  <circle cx="335" cy="175" r="4.5" fill="white" opacity="0.5"/>

  <!-- Happy eyebrows -->
  <path d="M 215 135 Q 240 118 265 135" fill="none" stroke="#cc4411" stroke-width="5" stroke-linecap="round"/>
  <path d="M 312 130 Q 335 115 360 132" fill="none" stroke="#cc4411" stroke-width="5" stroke-linecap="round"/>

  <!-- Rosy cheeks -->
  <ellipse cx="215" cy="200" rx="20" ry="13" fill="#ff9999" opacity="0.4"/>
  <ellipse cx="365" cy="195" rx="20" ry="13" fill="#ff9999" opacity="0.4"/>

  <!-- === MASSIVE HAPPY RED MOUTH === -->
  <path d="M 220 310 Q 295 410 375 310" fill="#dd1111"/>
  <path d="M 220 310 Q 295 410 375 310" fill="none" stroke="#aa0c0c" stroke-width="3"/>
  <!-- Tongue -->
  <ellipse cx="298" cy="358" rx="32" ry="20" fill="#ff4444"/>
  <!-- Teeth -->
  <rect x="266" y="310" width="24" height="18" rx="5" fill="white" stroke="#eee" stroke-width="1"/>
  <rect x="294" y="310" width="24" height="18" rx="5" fill="white" stroke="#eee" stroke-width="1"/>

  <!-- === LITTLE ARMS CELEBRATING === -->
  <path d="M 158 195 Q 110 140 85 95" stroke="#ff7733" stroke-width="14" stroke-linecap="round" fill="none"/>
  <circle cx="82" cy="90" r="13" fill="#ff7733"/>
  <path d="M 398 190 Q 430 135 455 90" stroke="#ff7733" stroke-width="14" stroke-linecap="round" fill="none"/>
  <circle cx="458" cy="85" r="13" fill="#ff7733"/>

  <!-- Little legs -->
  <path d="M 225 418 L 205 462" stroke="#ff7733" stroke-width="12" stroke-linecap="round"/>
  <ellipse cx="200" cy="468" rx="16" ry="9" fill="#ff7733"/>
  <path d="M 330 415 L 350 460" stroke="#ff7733" stroke-width="12" stroke-linecap="round"/>
  <ellipse cx="355" cy="466" rx="16" ry="9" fill="#ff7733"/>

  <!-- === PARTY HAT === -->
  <polygon points="285,18 245,92 325,92" fill="#22aa44"/>
  <line x1="265" y1="52" x2="257" y2="84" stroke="#ffee44" stroke-width="4" opacity="0.7"/>
  <line x1="285" y1="32" x2="285" y2="84" stroke="#ffee44" stroke-width="4" opacity="0.6"/>
  <line x1="305" y1="52" x2="313" y2="84" stroke="#ffee44" stroke-width="4" opacity="0.7"/>
  <circle cx="285" cy="14" r="14" fill="#ffee44"/>

  <!-- === HAPPY 7 (subtle, gray on white) === -->
  <g opacity="0.08">
    <text x="65" y="240" font-family="Arial,sans-serif" font-size="80" font-weight="900" fill="#ff8844">7</text>
    <circle cx="52" cy="192" r="4" fill="#ff8844"/>
    <circle cx="78" cy="190" r="4" fill="#ff8844"/>
    <path d="M 48 210 Q 68 222 88 210" fill="none" stroke="#ff8844" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- === HAPPY 9 === -->
  <g opacity="0.08">
    <text x="60" y="445" font-family="Arial,sans-serif" font-size="70" font-weight="900" fill="#ff8844">9</text>
    <circle cx="68" cy="400" r="3.5" fill="#ff8844"/>
    <circle cx="90" cy="398" r="3.5" fill="#ff8844"/>
    <path d="M 63 415 Q 80 425 97 415" fill="none" stroke="#ff8844" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- === CONFETTI (colorful on white!) === -->
  <circle cx="75" cy="100" r="8" fill="#55aaff" opacity="0.5"/>
  <circle cx="440" cy="400" r="9" fill="#ff55aa" opacity="0.45"/>
  <circle cx="100" cy="400" r="7" fill="#44cc44" opacity="0.4"/>
  <circle cx="430" cy="60" r="7" fill="#ffaa22" opacity="0.45"/>
  <circle cx="460" cy="250" r="6" fill="#aa55ff" opacity="0.35"/>
  <!-- Confetti shapes -->
  <rect x="120" y="60" width="10" height="5" rx="2" fill="#ff5577" opacity="0.4" transform="rotate(25,125,62)"/>
  <rect x="430" y="330" width="10" height="5" rx="2" fill="#55aaff" opacity="0.35" transform="rotate(-30,435,332)"/>

  <!-- === SPARKLE === -->
  <g transform="translate(70,310)" opacity="0.3">
    <line x1="0" y1="-12" x2="0" y2="12" stroke="#ffaa22" stroke-width="3" stroke-linecap="round"/>
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#ffaa22" stroke-width="3" stroke-linecap="round"/>
  </g>

  <text x="256" y="500" font-family="Georgia,serif" font-size="30" fill="#cc6622" text-anchor="middle" opacity="0.4" font-style="italic">HappyMoments</text>
</svg>
