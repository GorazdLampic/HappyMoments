<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Cartoon number style: thick outline, eyes on top, wide grin, arms+legs -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1035"/>
      <stop offset="100%" style="stop-color:#121228"/>
    </linearGradient>
    <linearGradient id="bodyColor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffe858"/>
      <stop offset="40%" style="stop-color:#ffcc22"/>
      <stop offset="100%" style="stop-color:#ee9900"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- === MAIN "3" BODY — thick, chunky, black outlined === -->
  <!-- Top horizontal bar -->
  <path d="M 140 95 L 355 95 C 355 95, 420 95, 420 160 C 420 225, 345 250, 290 255
           L 220 255
           L 290 245 C 335 240, 390 220, 390 165 C 390 118, 345 115, 335 115 L 170 115 Z"
        fill="url(#bodyColor)" stroke="#222" stroke-width="6" stroke-linejoin="round"/>

  <!-- Bottom bump -->
  <path d="M 220 255 L 295 255 C 350 255, 435 275, 435 355
           C 435 435, 340 460, 255 460 L 140 460
           L 140 440 L 255 440 C 330 440, 405 420, 405 355
           C 405 290, 330 275, 290 275 L 200 275 Z"
        fill="url(#bodyColor)" stroke="#222" stroke-width="6" stroke-linejoin="round"/>

  <!-- Fill center to connect -->
  <rect x="200" y="115" width="95" height="160" fill="url(#bodyColor)"/>
  <rect x="200" y="255" width="95" height="25" fill="url(#bodyColor)"/>

  <!-- Re-draw outlines clean -->
  <!-- Top outline -->
  <path d="M 140 95 L 355 95 C 420 95, 420 225, 290 255 L 220 255"
        fill="none" stroke="#222" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bottom outline -->
  <path d="M 220 255 L 295 255 C 435 255, 435 440, 255 460 L 140 460"
        fill="none" stroke="#222" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left side lines -->
  <line x1="140" y1="95" x2="140" y2="115" stroke="#222" stroke-width="7" stroke-linecap="round"/>
  <line x1="140" y1="440" x2="140" y2="460" stroke="#222" stroke-width="7" stroke-linecap="round"/>

  <!-- === EYES — inside upper part of 3 === -->
  <!-- Left eye -->
  <ellipse cx="265" cy="150" rx="28" ry="30" fill="white" stroke="#222" stroke-width="5"/>
  <ellipse cx="272" cy="153" rx="13" ry="15" fill="#222"/>
  <circle cx="277" cy="145" r="6" fill="white"/>
  <!-- Right eye -->
  <ellipse cx="350" cy="145" rx="26" ry="28" fill="white" stroke="#222" stroke-width="5"/>
  <ellipse cx="356" cy="148" rx="12" ry="14" fill="#222"/>
  <circle cx="361" cy="140" r="5.5" fill="white"/>

  <!-- Eyebrows -->
  <path d="M 242 112 Q 265 96 288 112" fill="none" stroke="#222" stroke-width="6" stroke-linecap="round"/>
  <path d="M 328 108 Q 350 92 375 110" fill="none" stroke="#222" stroke-width="6" stroke-linecap="round"/>

  <!-- === BIG WIDE GRIN — in lower part of 3, lowered === -->
  <path d="M 230 340 Q 320 420 400 340" fill="#dd1111" stroke="#222" stroke-width="5" stroke-linecap="round"/>
  <!-- Teeth -->
  <rect x="268" y="340" width="22" height="17" rx="3" fill="white" stroke="#222" stroke-width="1.5"/>
  <rect x="294" y="340" width="22" height="17" rx="3" fill="white" stroke="#222" stroke-width="1.5"/>
  <rect x="320" y="340" width="22" height="17" rx="3" fill="white" stroke="#222" stroke-width="1.5"/>
  <!-- Tongue -->
  <ellipse cx="310" cy="380" rx="25" ry="16" fill="#ff4444" stroke="#cc1111" stroke-width="1.5"/>

  <!-- === LITTLE ARMS === -->
  <!-- Left arm waving -->
  <path d="M 148 180 Q 100 130 75 85" stroke="#eebb00" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M 148 180 Q 100 130 75 85" stroke="#222" stroke-width="18" stroke-linecap="round" fill="none" opacity="0.15"/>
  <!-- Hand -->
  <circle cx="72" cy="80" r="16" fill="#eebb00" stroke="#222" stroke-width="4"/>
  <!-- Fingers -->
  <line x1="60" y1="68" x2="55" y2="55" stroke="#eebb00" stroke-width="6" stroke-linecap="round"/>
  <line x1="70" y1="64" x2="68" y2="50" stroke="#eebb00" stroke-width="6" stroke-linecap="round"/>
  <line x1="80" y1="65" x2="82" y2="52" stroke="#eebb00" stroke-width="6" stroke-linecap="round"/>

  <!-- Right arm -->
  <path d="M 420 300 Q 450 260 465 220" stroke="#eebb00" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M 420 300 Q 450 260 465 220" stroke="#222" stroke-width="18" stroke-linecap="round" fill="none" opacity="0.15"/>
  <circle cx="468" cy="215" r="15" fill="#eebb00" stroke="#222" stroke-width="4"/>

  <!-- === LITTLE LEGS === -->
  <path d="M 200 455 L 175 490" stroke="#eebb00" stroke-width="12" stroke-linecap="round"/>
  <ellipse cx="170" cy="495" rx="18" ry="10" fill="#eebb00" stroke="#222" stroke-width="3"/>
  <path d="M 310 455 L 335 490" stroke="#eebb00" stroke-width="12" stroke-linecap="round"/>
  <ellipse cx="340" cy="495" rx="18" ry="10" fill="#eebb00" stroke="#222" stroke-width="3"/>

  <!-- === PARTY HAT === -->
  <polygon points="295,10 258,72 332,72" fill="#ee2222" stroke="#222" stroke-width="4"/>
  <line x1="276" y1="38" x2="270" y2="64" stroke="#ffee44" stroke-width="3.5" opacity="0.7"/>
  <line x1="295" y1="22" x2="295" y2="64" stroke="#ffee44" stroke-width="3.5" opacity="0.6"/>
  <line x1="314" y1="38" x2="320" y2="64" stroke="#ffee44" stroke-width="3.5" opacity="0.7"/>
  <circle cx="295" cy="7" r="12" fill="#ffee44" stroke="#222" stroke-width="3"/>

  <!-- === SPARKLES === -->
  <g transform="translate(55,180)" opacity="0.7">
    <line x1="0" y1="-14" x2="0" y2="14" stroke="#ffee55" stroke-width="4" stroke-linecap="round"/>
    <line x1="-14" y1="0" x2="14" y2="0" stroke="#ffee55" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- === CONFETTI === -->
  <circle cx="85" cy="350" r="5" fill="#55aaff" opacity="0.6"/>
  <circle cx="460" cy="420" r="6" fill="#ff55aa" opacity="0.55"/>
  <circle cx="55" cy="430" r="4.5" fill="#55dd55" opacity="0.5"/>
  <circle cx="455" cy="130" r="5" fill="#ff8844" opacity="0.5"/>
</svg>
