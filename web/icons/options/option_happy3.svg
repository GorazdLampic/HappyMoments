<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- HAPPY 3: Bubbly balloon "3" with face, on gradient background with confetti party -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1030"/>
      <stop offset="100%" style="stop-color:#121228"/>
    </linearGradient>
    <radialGradient id="body" cx="40%" cy="35%">
      <stop offset="0%" style="stop-color:#ffe870"/>
      <stop offset="80%" style="stop-color:#f0c020"/>
      <stop offset="100%" style="stop-color:#d4a010"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Soft glow -->
  <circle cx="275" cy="250" r="190" fill="#f8e060" opacity="0.05"/>

  <!-- ROUND BUBBLY "3" BODY with radial gradient (balloon feel) -->
  <!-- Top half circle -->
  <path d="M 180 105 L 320 105 C 420 105, 420 240, 275 240 L 200 240"
        fill="url(#body)" stroke="#d4a010" stroke-width="3"/>
  <!-- Bottom half circle (bigger) -->
  <path d="M 200 250 L 280 250 C 430 250, 430 420, 260 420 L 155 420"
        fill="url(#body)" stroke="#d4a010" stroke-width="3"/>

  <!-- Shine highlight on the 3 (balloon reflection) -->
  <ellipse cx="340" cy="150" rx="25" ry="40" fill="white" opacity="0.15" transform="rotate(-15, 340, 150)"/>
  <ellipse cx="350" cy="320" rx="28" ry="45" fill="white" opacity="0.12" transform="rotate(-15, 350, 320)"/>

  <!-- === CUTE BIG EYES in top bubble === -->
  <!-- Left eye -->
  <circle cx="265" cy="165" r="28" fill="white"/>
  <circle cx="270" cy="169" r="18" fill="#1e1030"/>
  <circle cx="276" cy="158" r="8" fill="white"/>
  <circle cx="264" cy="174" r="4.5" fill="white" opacity="0.5"/>
  <!-- Right eye -->
  <circle cx="350" cy="160" r="26" fill="white"/>
  <circle cx="354" cy="164" r="16.5" fill="#1e1030"/>
  <circle cx="360" cy="153" r="7.5" fill="white"/>
  <circle cx="349" cy="169" r="4" fill="white" opacity="0.5"/>

  <!-- Happy raised eyebrows -->
  <path d="M 240 130 Q 265 115 290 130" fill="none" stroke="#c89010" stroke-width="5" stroke-linecap="round"/>
  <path d="M 328 125 Q 350 112 375 127" fill="none" stroke="#c89010" stroke-width="5" stroke-linecap="round"/>

  <!-- Pink cheeks -->
  <ellipse cx="240" cy="195" rx="18" ry="12" fill="#ff7777" opacity="0.35"/>
  <ellipse cx="378" cy="190" rx="18" ry="12" fill="#ff7777" opacity="0.35"/>

  <!-- === HUGE JOYFUL RED SMILE in bottom bubble === -->
  <path d="M 230 330 Q 310 430 390 330" fill="#dd1111"/>
  <path d="M 230 330 Q 310 430 390 330" fill="none" stroke="#aa0e0e" stroke-width="3"/>
  <!-- Tongue -->
  <ellipse cx="310" cy="375" rx="32" ry="20" fill="#ff4040"/>
  <!-- Teeth -->
  <rect x="278" y="330" width="24" height="18" rx="5" fill="white" opacity="0.9"/>
  <rect x="306" y="330" width="24" height="18" rx="5" fill="white" opacity="0.9"/>

  <!-- === PARTY HAT (big, colorful) === -->
  <polygon points="290,18 245,100 335,100" fill="#ee2222"/>
  <polygon points="290,18 265,65 315,65" fill="#22bb44" opacity="0.5"/>
  <line x1="268" y1="55" x2="258" y2="92" stroke="#ffee55" stroke-width="4" opacity="0.7"/>
  <line x1="290" y1="32" x2="290" y2="92" stroke="#ffee55" stroke-width="4" opacity="0.6"/>
  <line x1="312" y1="55" x2="322" y2="92" stroke="#ffee55" stroke-width="4" opacity="0.7"/>
  <circle cx="290" cy="14" r="15" fill="#ffee55"/>

  <!-- === LITTLE WAVING ARMS === -->
  <path d="M 178 170 Q 130 125 105 85" stroke="#e8b818" stroke-width="13" stroke-linecap="round" fill="none"/>
  <circle cx="102" cy="80" r="12" fill="#e8b818"/>
  <path d="M 180 340 Q 120 310 85 340" stroke="#e8b818" stroke-width="13" stroke-linecap="round" fill="none"/>
  <circle cx="80" cy="342" r="12" fill="#e8b818"/>

  <!-- === HAPPY 7 background (top-left) === -->
  <g opacity="0.1">
    <text x="70" y="175" font-family="Arial,sans-serif" font-size="70" font-weight="900" fill="#ffdd44">7</text>
    <path d="M 52 132 Q 62 122 72 132" fill="none" stroke="#ffdd44" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 80 130 Q 90 120 100 130" fill="none" stroke="#ffdd44" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 55 148 Q 75 158 95 148" fill="none" stroke="#ffdd44" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- === HAPPY 9 background (bottom-left) === -->
  <g opacity="0.1">
    <text x="70" y="470" font-family="Arial,sans-serif" font-size="65" font-weight="900" fill="#ffdd44">9</text>
    <path d="M 75 425 Q 83 417 91 425" fill="none" stroke="#ffdd44" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 103 423 Q 111 415 119 423" fill="none" stroke="#ffdd44" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 80 442 Q 98 452 116 442" fill="none" stroke="#ffdd44" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- === SPARKLES === -->
  <g transform="translate(450,110)" opacity="0.7">
    <line x1="0" y1="-16" x2="0" y2="16" stroke="#ffee55" stroke-width="4" stroke-linecap="round"/>
    <line x1="-16" y1="0" x2="16" y2="0" stroke="#ffee55" stroke-width="4" stroke-linecap="round"/>
    <line x1="-10" y1="-10" x2="10" y2="10" stroke="#ffee55" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="-10" x2="-10" y2="10" stroke="#ffee55" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g transform="translate(445,400)" opacity="0.4">
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#d4b876" stroke-width="3" stroke-linecap="round"/>
    <line x1="-10" y1="0" x2="10" y2="0" stroke="#d4b876" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- === CONFETTI (party!) === -->
  <circle cx="135" cy="55" r="5.5" fill="#55aaff" opacity="0.65"/>
  <circle cx="455" cy="300" r="5" fill="#ff55aa" opacity="0.55"/>
  <circle cx="445" cy="50" r="5" fill="#55dd55" opacity="0.55"/>
  <circle cx="460" cy="460" r="4" fill="#ff8844" opacity="0.45"/>
  <!-- Confetti rectangles (party streamers) -->
  <rect x="425" y="200" width="8" height="4" rx="2" fill="#ff55aa" opacity="0.4" transform="rotate(30, 429, 202)"/>
  <rect x="130" y="285" width="8" height="4" rx="2" fill="#55aaff" opacity="0.35" transform="rotate(-20, 134, 287)"/>
  <rect x="90" y="450" width="7" height="3.5" rx="2" fill="#55dd55" opacity="0.35" transform="rotate(15, 93, 451)"/>

  <!-- === MUSIC NOTE === -->
  <g transform="translate(450,250)" opacity="0.4">
    <ellipse cx="0" cy="0" rx="9" ry="6" fill="#d4b876" transform="rotate(-15)"/>
    <line x1="8" y1="-2" x2="8" y2="-28" stroke="#d4b876" stroke-width="2.5"/>
    <path d="M 8 -28 Q 18 -32 16 -22 Q 14 -16 8 -19" fill="#d4b876"/>
  </g>

  <text x="256" y="498" font-family="Georgia,serif" font-size="32" fill="#d4b876" text-anchor="middle" opacity="0.45" font-style="italic">HappyMoments</text>
</svg>
