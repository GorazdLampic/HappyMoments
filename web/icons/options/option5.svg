<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- OPTION 5: The 3 itself IS a person — top bump is head, bottom bump is body, dancing -->
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1030"/>
      <stop offset="100%" style="stop-color:#101828"/>
    </linearGradient>
    <linearGradient id="gold5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8e070"/>
      <stop offset="100%" style="stop-color:#d09820"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg5)"/>

  <!-- The 3 as a character body — thick and bubbly -->
  <!-- Top half (head) -->
  <circle cx="280" cy="165" r="75" fill="url(#gold5)"/>
  <!-- Bottom half (body) -->
  <circle cx="280" cy="340" r="90" fill="url(#gold5)"/>
  <!-- Connection (neck/waist) -->
  <rect x="250" y="220" width="60" height="40" fill="url(#gold5)"/>

  <!-- Face — on the top circle (head) -->
  <!-- Happy eyes -->
  <path d="M 248 150 Q 258 132 268 150" fill="none" stroke="#1a1030" stroke-width="7" stroke-linecap="round"/>
  <path d="M 290 150 Q 300 132 310 150" fill="none" stroke="#1a1030" stroke-width="7" stroke-linecap="round"/>
  <!-- Wide smile -->
  <path d="M 250 180 Q 280 210 310 180" fill="none" stroke="#1a1030" stroke-width="6" stroke-linecap="round"/>
  <!-- Blush -->
  <circle cx="242" cy="172" r="10" fill="#e87848" opacity="0.25"/>
  <circle cx="318" cy="172" r="10" fill="#e87848" opacity="0.25"/>

  <!-- Dancing legs -->
  <path d="M 240 415 L 210 470" stroke="#d4a030" stroke-width="12" stroke-linecap="round"/>
  <path d="M 320 415 L 350 470" stroke="#d4a030" stroke-width="12" stroke-linecap="round"/>

  <!-- Celebrating arms -->
  <path d="M 200 290 Q 140 240 120 180" stroke="#d4a030" stroke-width="10" stroke-linecap="round" fill="none"/>
  <path d="M 360 290 Q 400 230 430 180" stroke="#d4a030" stroke-width="10" stroke-linecap="round" fill="none"/>

  <!-- Party hat -->
  <polygon points="280,60 250,120 310,120" fill="#e83838"/>
  <circle cx="280" cy="56" r="12" fill="#f8e060"/>

  <!-- Stars at hands -->
  <g transform="translate(115,172)" opacity="0.9"><line x1="0" y1="-14" x2="0" y2="14" stroke="#f0d060" stroke-width="4" stroke-linecap="round"/><line x1="-14" y1="0" x2="14" y2="0" stroke="#f0d060" stroke-width="4" stroke-linecap="round"/><line x1="-9" y1="-9" x2="9" y2="9" stroke="#f0d060" stroke-width="3" stroke-linecap="round"/><line x1="9" y1="-9" x2="-9" y2="9" stroke="#f0d060" stroke-width="3" stroke-linecap="round"/></g>
  <g transform="translate(435,172)" opacity="0.9"><line x1="0" y1="-14" x2="0" y2="14" stroke="#f0d060" stroke-width="4" stroke-linecap="round"/><line x1="-14" y1="0" x2="14" y2="0" stroke="#f0d060" stroke-width="4" stroke-linecap="round"/><line x1="-9" y1="-9" x2="9" y2="9" stroke="#f0d060" stroke-width="3" stroke-linecap="round"/><line x1="9" y1="-9" x2="-9" y2="9" stroke="#f0d060" stroke-width="3" stroke-linecap="round"/></g>

  <!-- Music notes -->
  <g transform="translate(80,340)" opacity="0.55">
    <ellipse cx="0" cy="0" rx="9" ry="6" fill="#d4b876" transform="rotate(-20)"/>
    <line x1="8" y1="-2" x2="8" y2="-30" stroke="#d4b876" stroke-width="2.5"/>
    <path d="M 8 -30 Q 20 -34 18 -24 Q 16 -17 8 -20" fill="#d4b876"/>
  </g>

  <!-- Confetti -->
  <circle cx="90" cy="120" r="5" fill="#5aaad0" opacity="0.6"/>
  <circle cx="440" cy="400" r="6" fill="#e078b0" opacity="0.55"/>
  <circle cx="70" cy="440" r="4" fill="#70b870" opacity="0.5"/>

  <text x="256" y="500" font-family="Georgia,serif" font-size="34" fill="#d4b876" text-anchor="middle" opacity="0.6" font-style="italic">HappyMoments</text>
</svg>
