<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- HAPPY 2: Simple bold "3" with face directly painted on — no masking tricks -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1035"/>
      <stop offset="100%" style="stop-color:#121228"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffdd44"/>
      <stop offset="100%" style="stop-color:#eeaa11"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Big bold friendly "3" -->
  <text x="285" y="390" font-family="Arial Rounded MT Bold,Arial,sans-serif" font-size="380" font-weight="900" fill="url(#gold)" text-anchor="middle">3</text>

  <!-- === BIG ROUND EYES — positioned in upper half of the 3 === -->
  <!-- Left eye -->
  <ellipse cx="250" cy="170" rx="26" ry="28" fill="white"/>
  <ellipse cx="255" cy="174" rx="16" ry="18" fill="#1a1035"/>
  <circle cx="260" cy="163" r="8" fill="white"/>
  <circle cx="249" cy="178" r="4" fill="white" opacity="0.5"/>
  <!-- Right eye -->
  <ellipse cx="340" cy="165" rx="24" ry="26" fill="white"/>
  <ellipse cx="344" cy="169" rx="15" ry="17" fill="#1a1035"/>
  <circle cx="349" cy="158" r="7.5" fill="white"/>
  <circle cx="339" cy="173" r="3.5" fill="white" opacity="0.5"/>

  <!-- Happy eyebrows -->
  <path d="M 228 138 Q 250 125 272 138" fill="none" stroke="#cc8800" stroke-width="5" stroke-linecap="round"/>
  <path d="M 320 133 Q 340 122 362 135" fill="none" stroke="#cc8800" stroke-width="5" stroke-linecap="round"/>

  <!-- Rosy cheeks -->
  <ellipse cx="228" cy="200" rx="18" ry="12" fill="#ff7777" opacity="0.35"/>
  <ellipse cx="365" cy="195" rx="18" ry="12" fill="#ff7777" opacity="0.35"/>

  <!-- === HUGE HAPPY MOUTH in lower half of 3 === -->
  <path d="M 230 310 Q 300 395 370 310" fill="#dd1111"/>
  <path d="M 230 310 Q 300 395 370 310" fill="none" stroke="#991010" stroke-width="3"/>
  <!-- Tongue -->
  <ellipse cx="300" cy="352" rx="30" ry="18" fill="#ff4444"/>
  <!-- Teeth -->
  <rect x="272" y="310" width="22" height="16" rx="4" fill="white" opacity="0.9"/>
  <rect x="298" y="310" width="22" height="16" rx="4" fill="white" opacity="0.9"/>

  <!-- === LITTLE ARMS === -->
  <path d="M 165 200 Q 120 150 95 110" stroke="#f0c820" stroke-width="14" stroke-linecap="round" fill="none"/>
  <circle cx="92" cy="106" r="13" fill="#f0c820"/>
  <path d="M 400 200 Q 430 145 455 105" stroke="#f0c820" stroke-width="14" stroke-linecap="round" fill="none"/>
  <circle cx="458" cy="100" r="13" fill="#f0c820"/>

  <!-- Little legs -->
  <path d="M 230 420 L 210 465" stroke="#f0c820" stroke-width="12" stroke-linecap="round"/>
  <ellipse cx="205" cy="472" rx="16" ry="8" fill="#f0c820"/>
  <path d="M 330 420 L 350 465" stroke="#f0c820" stroke-width="12" stroke-linecap="round"/>
  <ellipse cx="355" cy="472" rx="16" ry="8" fill="#f0c820"/>

  <!-- === PARTY HAT === -->
  <polygon points="290,20 250,95 330,95" fill="#ee2222"/>
  <line x1="270" y1="55" x2="262" y2="87" stroke="#ffee55" stroke-width="4" opacity="0.7"/>
  <line x1="290" y1="35" x2="290" y2="87" stroke="#ffee55" stroke-width="4" opacity="0.6"/>
  <line x1="310" y1="55" x2="318" y2="87" stroke="#ffee55" stroke-width="4" opacity="0.7"/>
  <circle cx="290" cy="16" r="14" fill="#ffee55"/>

  <!-- === HAPPY 7 background === -->
  <g opacity="0.1">
    <text x="60" y="250" font-family="Arial,sans-serif" font-size="80" font-weight="900" fill="#ffdd44">7</text>
    <circle cx="55" cy="200" r="4" fill="#ffdd44"/>
    <circle cx="80" cy="198" r="4" fill="#ffdd44"/>
    <path d="M 48 218 Q 68 228 88 218" fill="none" stroke="#ffdd44" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- === HAPPY 9 background === -->
  <g opacity="0.1">
    <text x="60" y="430" font-family="Arial,sans-serif" font-size="70" font-weight="900" fill="#ffdd44">9</text>
    <circle cx="70" cy="385" r="3.5" fill="#ffdd44"/>
    <circle cx="92" cy="383" r="3.5" fill="#ffdd44"/>
    <path d="M 65 400 Q 82 410 98 400" fill="none" stroke="#ffdd44" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- === SPARKLES === -->
  <g transform="translate(75,130)" opacity="0.7">
    <line x1="0" y1="-15" x2="0" y2="15" stroke="#ffee55" stroke-width="4" stroke-linecap="round"/>
    <line x1="-15" y1="0" x2="15" y2="0" stroke="#ffee55" stroke-width="4" stroke-linecap="round"/>
    <line x1="-10" y1="-10" x2="10" y2="10" stroke="#ffee55" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="-10" x2="-10" y2="10" stroke="#ffee55" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- === CONFETTI === -->
  <circle cx="130" cy="55" r="5" fill="#55aaff" opacity="0.6"/>
  <circle cx="445" cy="380" r="6" fill="#ff55aa" opacity="0.5"/>
  <circle cx="70" cy="350" r="4.5" fill="#55dd55" opacity="0.5"/>
  <circle cx="455" cy="55" r="4" fill="#ff8844" opacity="0.5"/>

  <!-- === MUSIC NOTE === -->
  <g transform="translate(455,290)" opacity="0.4">
    <ellipse cx="0" cy="0" rx="8" ry="5.5" fill="#d4b876" transform="rotate(-15)"/>
    <line x1="7" y1="-2" x2="7" y2="-26" stroke="#d4b876" stroke-width="2.5"/>
    <path d="M 7 -26 Q 17 -30 15 -21 Q 13 -15 7 -18" fill="#d4b876"/>
  </g>

  <text x="256" y="500" font-family="Georgia,serif" font-size="30" fill="#d4b876" text-anchor="middle" opacity="0.45" font-style="italic">HappyMoments</text>
</svg>
