<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- OPTION 3: Minimalist — large "3" where top curve = eyes, bottom curve = smile, no circle face -->
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1030"/>
      <stop offset="100%" style="stop-color:#151525"/>
    </linearGradient>
    <linearGradient id="gold3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8e070"/>
      <stop offset="100%" style="stop-color:#d09820"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg3)"/>

  <!-- Large 3 — thick, friendly rounded -->
  <path d="M 145 130 C 145 130, 155 70, 260 70 C 365 70, 375 130, 375 160
           C 375 195, 310 220, 265 225"
        fill="none" stroke="url(#gold3)" stroke-width="38" stroke-linecap="round"/>
  <path d="M 265 225 C 315 230, 385 255, 385 320
           C 385 400, 280 430, 210 430 C 165 430, 130 410, 120 390"
        fill="none" stroke="url(#gold3)" stroke-width="38" stroke-linecap="round"/>

  <!-- Eyes sitting on top curve -->
  <!-- Left eye — big happy arc -->
  <path d="M 215 128 Q 232 100 249 128" fill="none" stroke="#1e1030" stroke-width="9" stroke-linecap="round"/>
  <!-- Right eye — big happy arc -->
  <path d="M 290 128 Q 307 100 324 128" fill="none" stroke="#1e1030" stroke-width="9" stroke-linecap="round"/>

  <!-- Smile on bottom curve — uses the curve itself, add teeth/grin -->
  <path d="M 240 350 Q 290 395 340 350" fill="none" stroke="#1e1030" stroke-width="7" stroke-linecap="round"/>

  <!-- Blush -->
  <circle cx="200" cy="160" r="15" fill="#f08080" opacity="0.2"/>
  <circle cx="340" cy="160" r="15" fill="#f08080" opacity="0.2"/>

  <!-- Party hat — big -->
  <polygon points="265,10 225,90 305,90" fill="#e83838" opacity="0.9"/>
  <circle cx="265" cy="8" r="14" fill="#f8e060"/>
  <line x1="245" y1="48" x2="237" y2="82" stroke="#f8e060" stroke-width="3" opacity="0.6"/>
  <line x1="265" y1="30" x2="265" y2="82" stroke="#f8e060" stroke-width="3" opacity="0.5"/>
  <line x1="285" y1="48" x2="293" y2="82" stroke="#f8e060" stroke-width="3" opacity="0.6"/>

  <!-- Sparkles -->
  <g transform="translate(70,200)" opacity="0.7"><line x1="0" y1="-18" x2="0" y2="18" stroke="#f0d060" stroke-width="4" stroke-linecap="round"/><line x1="-18" y1="0" x2="18" y2="0" stroke="#f0d060" stroke-width="4" stroke-linecap="round"/></g>
  <g transform="translate(445,100)" opacity="0.5"><line x1="0" y1="-12" x2="0" y2="12" stroke="#d4b876" stroke-width="3" stroke-linecap="round"/><line x1="-12" y1="0" x2="12" y2="0" stroke="#d4b876" stroke-width="3" stroke-linecap="round"/></g>

  <!-- Music note -->
  <g transform="translate(440,340)" opacity="0.5">
    <ellipse cx="0" cy="0" rx="10" ry="7" fill="#d4b876" transform="rotate(-15)"/>
    <line x1="9" y1="-3" x2="9" y2="-35" stroke="#d4b876" stroke-width="3"/>
    <path d="M 9 -35 Q 22 -39 20 -28 Q 18 -20 9 -23" fill="#d4b876"/>
  </g>

  <!-- Confetti -->
  <circle cx="80" cy="380" r="6" fill="#5aaad0" opacity="0.55"/>
  <circle cx="440" cy="430" r="5" fill="#e078b0" opacity="0.5"/>
  <circle cx="100" cy="100" r="4" fill="#70b870" opacity="0.5"/>

  <text x="256" y="490" font-family="Georgia,serif" font-size="36" fill="#d4b876" text-anchor="middle" opacity="0.65" font-style="italic">HappyMoments</text>
</svg>
