<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- OPTION 6: Elegant/premium — white 3 on dark with golden sparkle halo, subtle face -->
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1028"/>
      <stop offset="100%" style="stop-color:#0e0e1e"/>
    </linearGradient>
    <linearGradient id="white6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e0d8d0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg6)"/>

  <!-- Golden halo ring -->
  <circle cx="256" cy="255" r="175" fill="none" stroke="#d4b876" stroke-width="2" opacity="0.3"/>
  <circle cx="256" cy="255" r="185" fill="none" stroke="#d4b876" stroke-width="1" opacity="0.15"/>

  <!-- Large elegant 3 -->
  <text x="256" y="340" font-family="Georgia,'Times New Roman',serif" font-size="300" font-weight="400" fill="url(#white6)" text-anchor="middle" font-style="italic">3</text>

  <!-- Subtle face — delicate, premium feel -->
  <!-- Gentle happy eyes -->
  <path d="M 210 178 Q 222 160 234 178" fill="none" stroke="#d4b876" stroke-width="5" stroke-linecap="round"/>
  <path d="M 282 178 Q 294 160 306 178" fill="none" stroke="#d4b876" stroke-width="5" stroke-linecap="round"/>

  <!-- Gentle smile -->
  <path d="M 218 310 Q 258 345 300 310" fill="none" stroke="#d4b876" stroke-width="4" stroke-linecap="round"/>

  <!-- Small party hat — elegant -->
  <polygon points="255,55 235,115 275,115" fill="#d4b876" opacity="0.7"/>
  <circle cx="255" cy="52" r="8" fill="#f0d060" opacity="0.9"/>

  <!-- Golden sparkles scattered — like a constellation -->
  <circle cx="100" cy="100" r="3" fill="#f0d060" opacity="0.8"/>
  <circle cx="420" cy="90" r="2.5" fill="#f0d060" opacity="0.7"/>
  <circle cx="440" cy="400" r="3" fill="#f0d060" opacity="0.6"/>
  <circle cx="75" cy="380" r="2.5" fill="#f0d060" opacity="0.5"/>
  <circle cx="130" cy="200" r="2" fill="#f0d060" opacity="0.6"/>
  <circle cx="400" cy="250" r="2" fill="#f0d060" opacity="0.5"/>
  <circle cx="350" cy="440" r="2.5" fill="#f0d060" opacity="0.4"/>
  <circle cx="90" cy="300" r="2" fill="#f0d060" opacity="0.45"/>

  <!-- Small star accents -->
  <g transform="translate(80,140)" opacity="0.6"><line x1="0" y1="-10" x2="0" y2="10" stroke="#d4b876" stroke-width="2" stroke-linecap="round"/><line x1="-10" y1="0" x2="10" y2="0" stroke="#d4b876" stroke-width="2" stroke-linecap="round"/></g>
  <g transform="translate(430,170)" opacity="0.5"><line x1="0" y1="-8" x2="0" y2="8" stroke="#d4b876" stroke-width="2" stroke-linecap="round"/><line x1="-8" y1="0" x2="8" y2="0" stroke="#d4b876" stroke-width="2" stroke-linecap="round"/></g>

  <!-- Music note — small, elegant -->
  <g transform="translate(420,330)" opacity="0.35">
    <ellipse cx="0" cy="0" rx="7" ry="5" fill="#d4b876" transform="rotate(-15)"/>
    <line x1="6" y1="-2" x2="6" y2="-24" stroke="#d4b876" stroke-width="2"/>
    <path d="M 6 -24 Q 16 -27 14 -18 Q 12 -13 6 -15" fill="#d4b876"/>
  </g>

  <!-- Rocket — tiny, subtle -->
  <g transform="translate(80,420) rotate(-40)" opacity="0.35">
    <ellipse cx="0" cy="0" rx="5" ry="12" fill="#d4b876"/>
    <path d="M -3 -12 Q 0 -20 3 -12" fill="#e87848"/>
    <path d="M -2 12 Q 0 18 2 12" fill="#f0d060" opacity="0.7"/>
  </g>

  <text x="256" y="480" font-family="Georgia,serif" font-size="38" fill="#d4b876" text-anchor="middle" opacity="0.55" font-style="italic">HappyMoments</text>
</svg>
