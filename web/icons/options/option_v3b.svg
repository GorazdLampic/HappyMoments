<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Version B: Simpler, using a font "3" with face — like the blue 3 with hat reference -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1035"/>
      <stop offset="100%" style="stop-color:#121228"/>
    </linearGradient>
    <linearGradient id="body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#44ddff"/>
      <stop offset="50%" style="stop-color:#22bbdd"/>
      <stop offset="100%" style="stop-color:#1199bb"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Big chunky "3" — the body -->
  <text x="275" y="420" font-family="Arial Black,Impact,sans-serif" font-size="420" font-weight="900"
        fill="url(#body)" stroke="#0a6680" stroke-width="8" text-anchor="middle"
        paint-order="stroke">3</text>

  <!-- === EYES — inside upper part of 3 === -->
  <!-- Left eye -->
  <ellipse cx="240" cy="155" rx="30" ry="32" fill="white" stroke="#0a6680" stroke-width="5"/>
  <ellipse cx="248" cy="158" rx="14" ry="16" fill="#111"/>
  <circle cx="253" cy="149" r="7" fill="white"/>
  <!-- Right eye -->
  <ellipse cx="335" cy="150" rx="28" ry="30" fill="white" stroke="#0a6680" stroke-width="5"/>
  <ellipse cx="342" cy="153" rx="13" ry="15" fill="#111"/>
  <circle cx="347" cy="144" r="6.5" fill="white"/>

  <!-- Eyebrows -->
  <path d="M 215 118 Q 240 100 268 118" fill="none" stroke="#0a6680" stroke-width="7" stroke-linecap="round"/>
  <path d="M 310 114 Q 335 96 365 116" fill="none" stroke="#0a6680" stroke-width="7" stroke-linecap="round"/>

  <!-- === WIDE OPEN GRIN — in lower part of 3 === -->
  <path d="M 215 340 Q 300 425 385 340" fill="#dd1111" stroke="#0a6680" stroke-width="5" stroke-linecap="round"/>
  <!-- Teeth row -->
  <rect x="248" y="340" width="20" height="17" rx="3" fill="white" stroke="#ddd" stroke-width="1"/>
  <rect x="272" y="340" width="20" height="17" rx="3" fill="white" stroke="#ddd" stroke-width="1"/>
  <rect x="296" y="340" width="20" height="17" rx="3" fill="white" stroke="#ddd" stroke-width="1"/>
  <rect x="320" y="340" width="20" height="17" rx="3" fill="white" stroke="#ddd" stroke-width="1"/>
  <!-- Tongue -->
  <ellipse cx="295" cy="380" rx="27" ry="18" fill="#ff4444"/>

  <!-- === ARMS — waving happily === -->
  <!-- Left arm + hand (waving) -->
  <path d="M 138 180 Q 90 120 60 70" stroke="#22bbdd" stroke-width="16" stroke-linecap="round" fill="none"/>
  <circle cx="56" cy="64" r="18" fill="#22bbdd" stroke="#0a6680" stroke-width="4"/>
  <!-- Fingers spread -->
  <line x1="42" y1="50" x2="35" y2="35" stroke="#22bbdd" stroke-width="7" stroke-linecap="round"/>
  <line x1="54" y1="46" x2="50" y2="30" stroke="#22bbdd" stroke-width="7" stroke-linecap="round"/>
  <line x1="66" y1="48" x2="68" y2="32" stroke="#22bbdd" stroke-width="7" stroke-linecap="round"/>
  <line x1="74" y1="54" x2="82" y2="40" stroke="#22bbdd" stroke-width="7" stroke-linecap="round"/>

  <!-- Right arm -->
  <path d="M 410 310 Q 445 260 460 200" stroke="#22bbdd" stroke-width="16" stroke-linecap="round" fill="none"/>
  <circle cx="463" cy="194" r="16" fill="#22bbdd" stroke="#0a6680" stroke-width="4"/>

  <!-- === LEGS — walking/running like the blue 3 reference === -->
  <path d="M 195 425 Q 170 465 155 490" stroke="#22bbdd" stroke-width="14" stroke-linecap="round" fill="none"/>
  <ellipse cx="148" cy="496" rx="22" ry="10" fill="#22bbdd" stroke="#0a6680" stroke-width="3"/>
  <path d="M 320 420 Q 350 460 370 490" stroke="#22bbdd" stroke-width="14" stroke-linecap="round" fill="none"/>
  <ellipse cx="377" cy="496" rx="22" ry="10" fill="#22bbdd" stroke="#0a6680" stroke-width="3"/>

  <!-- === PARTY HAT === -->
  <polygon points="280,2 240,70 320,70" fill="#ffcc00" stroke="#0a6680" stroke-width="4"/>
  <circle cx="280" cy="0" r="10" fill="#ff4444" stroke="#0a6680" stroke-width="3"/>

  <!-- === FLAG in right hand === -->
  <line x1="463" y1="194" x2="463" y2="140" stroke="#0a6680" stroke-width="3"/>
  <polygon points="463,140 463,165 490,152" fill="#ffcc00" stroke="#0a6680" stroke-width="2"/>

  <!-- === SPARKLES === -->
  <g transform="translate(55,300)" opacity="0.6">
    <line x1="0" y1="-14" x2="0" y2="14" stroke="#ffee55" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-14" y1="0" x2="14" y2="0" stroke="#ffee55" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- === CONFETTI === -->
  <circle cx="100" cy="400" r="5" fill="#ff55aa" opacity="0.55"/>
  <circle cx="445" cy="440" r="6" fill="#55ff55" opacity="0.5"/>
  <circle cx="440" cy="80" r="5" fill="#ff8844" opacity="0.5"/>
  <circle cx="90" cy="450" r="4" fill="#55aaff" opacity="0.45"/>
</svg>
