<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1035"/>
      <stop offset="100%" style="stop-color:#121228"/>
    </linearGradient>
    <linearGradient id="body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffe858"/>
      <stop offset="40%" style="stop-color:#ffcc22"/>
      <stop offset="100%" style="stop-color:#ee9900"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Bold "8" with open left side suggesting "3" -->
  <text x="268" y="390"
        font-family="Arial Black, Impact, Arial, sans-serif"
        font-size="340" font-weight="900"
        fill="url(#body)" stroke="#222" stroke-width="7"
        text-anchor="middle" paint-order="stroke">8</text>

  <!-- Open left side to hint at "3" — mask part of the 8 -->
  <path d="M 128 155 C 128 125, 148 95, 178 78" fill="none" stroke="#1e1035" stroke-width="30" stroke-linecap="round"/>
  <path d="M 118 365 C 118 395, 142 425, 175 442" fill="none" stroke="#1e1035" stroke-width="30" stroke-linecap="round"/>

  <!-- Eyes — happy arcs inside upper curve -->
  <path d="M 218 160 Q 238 130 258 160" fill="none" stroke="#222" stroke-width="8" stroke-linecap="round"/>
  <path d="M 288 155 Q 308 125 328 155" fill="none" stroke="#222" stroke-width="8" stroke-linecap="round"/>

  <!-- Eyebrows -->
  <path d="M 212 135 Q 238 118 264 135" fill="none" stroke="#222" stroke-width="6" stroke-linecap="round"/>
  <path d="M 282 130 Q 308 114 335 132" fill="none" stroke="#222" stroke-width="6" stroke-linecap="round"/>

  <!-- Warm smile — not too big, no teeth -->
  <path d="M 215 335 Q 270 385 330 335" fill="none" stroke="#222" stroke-width="7" stroke-linecap="round"/>

  <!-- Blush — soft warm tone -->
  <circle cx="205" cy="175" r="16" fill="#e8a060" opacity="0.25"/>
  <circle cx="335" cy="172" r="16" fill="#e8a060" opacity="0.25"/>

  <!-- Sparkle — one, elegant -->
  <g transform="translate(130,275)" opacity="0.75">
    <line x1="0" y1="-16" x2="0" y2="16" stroke="#ffe855" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="-16" y1="0" x2="16" y2="0" stroke="#ffe855" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="-10" y1="-10" x2="10" y2="10" stroke="#ffe855" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="10" y1="-10" x2="-10" y2="10" stroke="#ffe855" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Small sparkle -->
  <g transform="translate(420,120)" opacity="0.55">
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#d4b876" stroke-width="3" stroke-linecap="round"/>
    <line x1="-10" y1="0" x2="10" y2="0" stroke="#d4b876" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
