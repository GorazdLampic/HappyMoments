<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- HappyMoments icon — compact "3" face, fits in adaptive icon safe zone -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1035"/>
      <stop offset="100%" style="stop-color:#121228"/>
    </linearGradient>
    <linearGradient id="body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffe858"/>
      <stop offset="40%" style="stop-color:#ffcc22"/>
      <stop offset="100%" style="stop-color:#ee9900"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!--
    SAFE ZONE: Android adaptive icons crop to ~66% circle.
    Keep all key content within x:100-412, y:80-432
    Center of icon: 256, 256
  -->

  <!-- === BOLD "3" — simple, chunky, centered === -->
  <!-- Using a font-rendered 3 for maximum clarity at small sizes -->
  <text x="270" y="380"
        font-family="Arial Black, Impact, Arial, sans-serif"
        font-size="340" font-weight="900"
        fill="url(#body)" stroke="#222" stroke-width="8"
        text-anchor="middle" paint-order="stroke">3</text>

  <!-- === EYES — big, simple, inside upper curve of 3 === -->
  <!-- Left eye -->
  <circle cx="240" cy="165" r="26" fill="white" stroke="#222" stroke-width="5"/>
  <circle cx="246" cy="168" r="13" fill="#222"/>
  <circle cx="252" cy="160" r="6" fill="white"/>
  <!-- Right eye -->
  <circle cx="325" cy="160" r="24" fill="white" stroke="#222" stroke-width="5"/>
  <circle cx="330" cy="163" r="12" fill="#222"/>
  <circle cx="336" cy="155" r="5.5" fill="white"/>

  <!-- Eyebrows — simple happy arcs -->
  <path d="M 218 133 Q 240 118 262 133" fill="none" stroke="#222" stroke-width="6" stroke-linecap="round"/>
  <path d="M 305 128 Q 325 114 348 130" fill="none" stroke="#222" stroke-width="6" stroke-linecap="round"/>

  <!-- === BIG SMILE — in lower curve of 3 === -->
  <path d="M 220 330 Q 290 400 360 330" fill="#dd1111" stroke="#222" stroke-width="5" stroke-linecap="round"/>
  <!-- Teeth -->
  <rect x="254" y="330" width="22" height="16" rx="4" fill="white" stroke="#eee" stroke-width="1"/>
  <rect x="280" y="330" width="22" height="16" rx="4" fill="white" stroke="#eee" stroke-width="1"/>
  <rect x="306" y="330" width="22" height="16" rx="4" fill="white" stroke="#eee" stroke-width="1"/>
  <!-- Tongue -->
  <ellipse cx="290" cy="368" rx="22" ry="14" fill="#ff4444"/>

  <!-- === PARTY HAT — compact, inside safe zone === -->
  <polygon points="268,72 240,130 296,130" fill="#ee2222" stroke="#222" stroke-width="4"/>
  <line x1="254" y1="98" x2="250" y2="124" stroke="#ffee44" stroke-width="3" opacity="0.7"/>
  <line x1="268" y1="82" x2="268" y2="124" stroke="#ffee44" stroke-width="3" opacity="0.6"/>
  <line x1="282" y1="98" x2="286" y2="124" stroke="#ffee44" stroke-width="3" opacity="0.7"/>
  <circle cx="268" cy="68" r="10" fill="#ffee44" stroke="#222" stroke-width="3"/>

  <!-- === SPARKLES — within safe zone === -->
  <g transform="translate(140,120)" opacity="0.75">
    <line x1="0" y1="-12" x2="0" y2="12" stroke="#ffee55" stroke-width="4" stroke-linecap="round"/>
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#ffee55" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g transform="translate(390,250)" opacity="0.55">
    <line x1="0" y1="-9" x2="0" y2="9" stroke="#ffee55" stroke-width="3" stroke-linecap="round"/>
    <line x1="-9" y1="0" x2="9" y2="0" stroke="#ffee55" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Confetti dots — inside safe zone -->
  <circle cx="150" cy="300" r="6" fill="#55aaff" opacity="0.6"/>
  <circle cx="380" cy="380" r="7" fill="#ff55aa" opacity="0.55"/>
  <circle cx="150" cy="400" r="5" fill="#55dd55" opacity="0.5"/>
  <circle cx="380" cy="120" r="5" fill="#ff8844" opacity="0.5"/>
</svg>
