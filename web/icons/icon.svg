<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#252030"/>
    </linearGradient>
    <linearGradient id="numGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8d5a0"/>
      <stop offset="50%" style="stop-color:#d4b876"/>
      <stop offset="100%" style="stop-color:#b89a50"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#d4b876;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#d4b876;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background — dark, premium -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Subtle glow behind the number -->
  <ellipse cx="256" cy="256" rx="160" ry="200" fill="url(#accentGlow)"/>

  <!-- The "8" — elegant, serif-inspired, contains implied "3" in its curves -->
  <!-- Upper loop of 8 (smaller, like the top of a 3) -->
  <path d="M 256 48
           C 340 48, 380 100, 380 148
           C 380 196, 340 232, 256 232
           C 172 232, 132 196, 132 148
           C 132 100, 172 48, 256 48 Z"
        fill="none" stroke="url(#numGold)" stroke-width="28"
        stroke-linejoin="round"/>

  <!-- Lower loop of 8 (larger, elegant) -->
  <path d="M 256 232
           C 355 232, 400 295, 400 348
           C 400 410, 355 464, 256 464
           C 157 464, 112 410, 112 348
           C 112 295, 157 232, 256 232 Z"
        fill="none" stroke="url(#numGold)" stroke-width="28"
        stroke-linejoin="round"/>

  <!-- Subtle "3" suggestion — a small opening on the left side of the 8 -->
  <!-- This makes the left side slightly open, hinting at a 3 -->
  <path d="M 142 148 C 142 120, 160 90, 190 72"
        fill="none" stroke="#1a1a1a" stroke-width="32"
        stroke-linecap="round"/>
  <path d="M 122 348 C 122 380, 140 420, 175 445"
        fill="none" stroke="#1a1a1a" stroke-width="32"
        stroke-linecap="round"/>

  <!-- Tiny sparkle dot — top right, elegant accent -->
  <circle cx="390" cy="90" r="4" fill="#d4b876" opacity="0.7"/>
  <circle cx="400" cy="82" r="2.5" fill="#d4b876" opacity="0.5"/>

  <!-- Subtle corner accents — premium feel -->
  <path d="M 50 80 L 50 50 L 80 50" fill="none" stroke="#d4b876" stroke-width="2" opacity="0.15"/>
  <path d="M 432 50 L 462 50 L 462 80" fill="none" stroke="#d4b876" stroke-width="2" opacity="0.15"/>
  <path d="M 50 432 L 50 462 L 80 462" fill="none" stroke="#d4b876" stroke-width="2" opacity="0.15"/>
  <path d="M 432 462 L 462 462 L 462 432" fill="none" stroke="#d4b876" stroke-width="2" opacity="0.15"/>
</svg>
