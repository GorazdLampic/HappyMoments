<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1035"/>
      <stop offset="100%" style="stop-color:#121228"/>
    </linearGradient>
    <linearGradient id="body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffe858"/>
      <stop offset="40%" style="stop-color:#ffcc22"/>
      <stop offset="100%" style="stop-color:#ee9900"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- === BOLD "3" centered === -->
  <text x="265" y="385"
        font-family="Arial Black, Impact, Arial, sans-serif"
        font-size="350" font-weight="900"
        fill="url(#body)" stroke="#222" stroke-width="8"
        text-anchor="middle" paint-order="stroke">3</text>

  <!-- === EYES — bigger, shifted left, inside upper curve === -->
  <!-- Left eye -->
  <circle cx="215" cy="165" r="30" fill="white" stroke="#222" stroke-width="6"/>
  <circle cx="222" cy="168" r="15" fill="#222"/>
  <circle cx="229" cy="158" r="7" fill="white"/>
  <!-- Right eye -->
  <circle cx="305" cy="158" r="28" fill="white" stroke="#222" stroke-width="6"/>
  <circle cx="311" cy="161" r="14" fill="#222"/>
  <circle cx="318" cy="151" r="6.5" fill="white"/>

  <!-- Eyebrows — thicker, shifted left, clearly visible -->
  <path d="M 188 128 Q 215 108 242 128" fill="none" stroke="#222" stroke-width="8" stroke-linecap="round"/>
  <path d="M 280 122 Q 305 104 333 124" fill="none" stroke="#222" stroke-width="8" stroke-linecap="round"/>

  <!-- === BIG RED HAPPY MOUTH — shifted left, wide open === -->
  <path d="M 190 330 Q 270 420 345 330" fill="#dd1111" stroke="#222" stroke-width="6" stroke-linecap="round"/>
  <!-- Teeth -->
  <rect x="228" y="330" width="24" height="18" rx="4" fill="white" stroke="#eee" stroke-width="1"/>
  <rect x="256" y="330" width="24" height="18" rx="4" fill="white" stroke="#eee" stroke-width="1"/>
  <rect x="284" y="330" width="24" height="18" rx="4" fill="white" stroke="#eee" stroke-width="1"/>
  <!-- Tongue -->
  <ellipse cx="268" cy="372" rx="28" ry="18" fill="#ff4444"/>

  <!-- === PARTY HAT — shifted left with eyes === -->
  <polygon points="245,68 215,132 275,132" fill="#ee2222" stroke="#222" stroke-width="5"/>
  <line x1="230" y1="96" x2="225" y2="124" stroke="#ffee44" stroke-width="3.5" opacity="0.7"/>
  <line x1="245" y1="78" x2="245" y2="124" stroke="#ffee44" stroke-width="3.5" opacity="0.6"/>
  <line x1="260" y1="96" x2="265" y2="124" stroke="#ffee44" stroke-width="3.5" opacity="0.7"/>
  <circle cx="245" cy="64" r="11" fill="#ffee44" stroke="#222" stroke-width="3"/>

  <!-- === ONE STAR — bigger, visible at small size === -->
  <g transform="translate(140,260)" opacity="0.85">
    <line x1="0" y1="-18" x2="0" y2="18" stroke="#ffee55" stroke-width="5" stroke-linecap="round"/>
    <line x1="-18" y1="0" x2="18" y2="0" stroke="#ffee55" stroke-width="5" stroke-linecap="round"/>
    <line x1="-12" y1="-12" x2="12" y2="12" stroke="#ffee55" stroke-width="4" stroke-linecap="round"/>
    <line x1="12" y1="-12" x2="-12" y2="12" stroke="#ffee55" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- === ONE MUSIC NOTE — bigger === -->
  <g transform="translate(395,300)" opacity="0.7">
    <ellipse cx="0" cy="0" rx="14" ry="9" fill="#d4b876" transform="rotate(-20)"/>
    <line x1="12" y1="-4" x2="12" y2="-42" stroke="#d4b876" stroke-width="4"/>
    <path d="M 12 -42 Q 28 -48 25 -34 Q 22 -24 12 -28" fill="#d4b876"/>
  </g>

  <!-- === ONE FLOWER === -->
  <g transform="translate(150,400)" opacity="0.7">
    <!-- Petals -->
    <circle cx="0" cy="-10" r="7" fill="#ff77aa"/>
    <circle cx="9" cy="-3" r="7" fill="#ff77aa"/>
    <circle cx="6" cy="8" r="7" fill="#ff77aa"/>
    <circle cx="-6" cy="8" r="7" fill="#ff77aa"/>
    <circle cx="-9" cy="-3" r="7" fill="#ff77aa"/>
    <!-- Center -->
    <circle cx="0" cy="0" r="5" fill="#ffdd44"/>
  </g>
</svg>
