<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a1a3a"/>
      <stop offset="100%" style="stop-color:#1a1a2a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8c860"/>
      <stop offset="100%" style="stop-color:#d4a030"/>
    </linearGradient>
  </defs>

  <!-- Background — rounded square -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Subtle circle behind the number -->
  <circle cx="256" cy="240" r="155" fill="none" stroke="#d4b876" stroke-width="3" opacity="0.15"/>

  <!-- The big "3" as a smiley — the hero -->
  <!-- Number 3 body -->
  <text x="256" y="310" font-family="Georgia, 'Times New Roman', serif" font-size="280" font-weight="700" fill="url(#gold)" text-anchor="middle" opacity="0.95">3</text>

  <!-- Left eye (wink) — a curved line -->
  <path d="M 195 185 Q 205 175 215 185" fill="none" stroke="#1a1a2a" stroke-width="7" stroke-linecap="round"/>

  <!-- Right eye — open, happy -->
  <circle cx="295" cy="180" r="9" fill="#1a1a2a"/>

  <!-- Sparkle top-left -->
  <g transform="translate(85, 80)" opacity="0.9">
    <line x1="0" y1="-18" x2="0" y2="18" stroke="#e8c860" stroke-width="4" stroke-linecap="round"/>
    <line x1="-18" y1="0" x2="18" y2="0" stroke="#e8c860" stroke-width="4" stroke-linecap="round"/>
    <line x1="-12" y1="-12" x2="12" y2="12" stroke="#e8c860" stroke-width="3" stroke-linecap="round"/>
    <line x1="12" y1="-12" x2="-12" y2="12" stroke="#e8c860" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Sparkle top-right -->
  <g transform="translate(420, 100)" opacity="0.7">
    <line x1="0" y1="-14" x2="0" y2="14" stroke="#d4b876" stroke-width="3" stroke-linecap="round"/>
    <line x1="-14" y1="0" x2="14" y2="0" stroke="#d4b876" stroke-width="3" stroke-linecap="round"/>
    <line x1="-9" y1="-9" x2="9" y2="9" stroke="#d4b876" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="9" y1="-9" x2="-9" y2="9" stroke="#d4b876" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Sparkle bottom-left -->
  <g transform="translate(100, 400)" opacity="0.5">
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#d4b876" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-10" y1="0" x2="10" y2="0" stroke="#d4b876" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Confetti dots -->
  <circle cx="140" cy="140" r="6" fill="#e87848" opacity="0.7"/>
  <circle cx="400" cy="60" r="5" fill="#5aaad0" opacity="0.6"/>
  <circle cx="430" cy="380" r="7" fill="#e078b0" opacity="0.6"/>
  <circle cx="75" cy="300" r="5" fill="#70b870" opacity="0.5"/>
  <circle cx="350" cy="440" r="4" fill="#5aaad0" opacity="0.5"/>

  <!-- Party hat hint on top of the 3 -->
  <polygon points="256,55 235,115 277,115" fill="#e87848" opacity="0.8"/>
  <circle cx="256" cy="52" r="7" fill="#e8c860"/>

  <!-- Bottom text -->
  <text x="256" y="465" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="400" fill="#d4b876" text-anchor="middle" opacity="0.8" font-style="italic">HappyMoments</text>
</svg>
