<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8c860"/>
      <stop offset="100%" style="stop-color:#d4a030"/>
    </linearGradient>
  </defs>

  <!-- The big "3" smiley — centered for adaptive icon safe zone -->
  <text x="256" y="320" font-family="Georgia, 'Times New Roman', serif" font-size="300" font-weight="700" fill="url(#gold)" text-anchor="middle">3</text>

  <!-- Wink eye -->
  <path d="M 195 190 Q 205 178 215 190" fill="none" stroke="#1a1a2a" stroke-width="8" stroke-linecap="round"/>

  <!-- Open eye -->
  <circle cx="298" cy="185" r="10" fill="#1a1a2a"/>

  <!-- Party hat -->
  <polygon points="256,55 232,120 280,120" fill="#e87848" opacity="0.85"/>
  <circle cx="256" cy="52" r="8" fill="#e8c860"/>

  <!-- Sparkle -->
  <g transform="translate(400, 110)" opacity="0.8">
    <line x1="0" y1="-16" x2="0" y2="16" stroke="#e8c860" stroke-width="4" stroke-linecap="round"/>
    <line x1="-16" y1="0" x2="16" y2="0" stroke="#e8c860" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
