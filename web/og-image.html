<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a1a; display: flex; align-items: center; justify-content: center; height: 100vh; }
.card {
    width: 1200px;
    height: 630px;
    background: linear-gradient(135deg, #1a1a1a 0%, #2a2220 50%, #1a1a1a 100%);
    border: 2px solid rgba(212, 184, 118, 0.3);
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'EB Garamond', 'Georgia', serif;
    color: #e0e0e0;
    position: relative;
    overflow: hidden;
}
.card::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle at 60% 40%, rgba(212, 184, 118, 0.08) 0%, transparent 50%);
}
.number {
    font-size: 120px;
    font-weight: 700;
    color: #d4b876;
    letter-spacing: 4px;
    text-shadow: 0 0 40px rgba(212, 184, 118, 0.3);
    position: relative;
    z-index: 1;
}
.label {
    font-size: 32px;
    color: #aaa;
    margin-top: -10px;
    letter-spacing: 2px;
    position: relative;
    z-index: 1;
}
.tagline {
    font-size: 28px;
    color: #d4b876;
    margin-top: 30px;
    font-style: italic;
    position: relative;
    z-index: 1;
}
.subtitle {
    font-size: 20px;
    color: #888;
    margin-top: 12px;
    position: relative;
    z-index: 1;
}
.url {
    position: absolute;
    bottom: 30px;
    right: 40px;
    font-size: 22px;
    color: rgba(212, 184, 118, 0.6);
    font-family: 'Segoe UI', sans-serif;
    z-index: 1;
}
.logo {
    position: absolute;
    bottom: 28px;
    left: 40px;
    font-size: 24px;
    color: rgba(212, 184, 118, 0.8);
    font-weight: 600;
    z-index: 1;
}
</style>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
<!--
    Open this in a browser at 100% zoom and screenshot the card.
    Save as web/og-image.png (1200x630).
    Then update og:image meta tags in index.html and landing.html.
-->
<div class="card">
    <div class="number">1,000,000,000</div>
    <div class="label">seconds alive</div>
    <div class="tagline">When's YOUR billion?</div>
    <div class="subtitle">Discover hidden number milestones in your life</div>
    <div class="logo">HappyMoments</div>
    <div class="url">happymoments.app</div>
</div>
</body>
</html>
